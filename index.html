<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Check Again</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="shopping-app">
    <header class="app-header">
      <h1>Check Again</h1>

      <p>
        Personalize seus itens e acompanhe o valor total de uma maneira...
        Interessante.
      </p>
    </header>

    <section class="form-section">
      <form id="shopping-form">
        <div class="field-group">
          <label for="product">Produto</label>
    
          <input
            type="text"
            id="product"
            placeholder="Ex.: Arroz"
            required
          >
        </div>
    
        <div class="field-group">
          <label for="quantity">Quantidade</label>
    
          <input
            type="number"
            id="quantity"
            min="1"
            value="1"
            required
          >
        </div>
    
        <div class="field-group">
          <label for="price">Preço unitário</label>
    
          <input
            type="number"
            id="price"
            min="0"
            step="0.01"
            placeholder="0,00"
            required
          >
        </div>
    
        <button type="submit">
          Adicionar item
        </button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
