<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Check Again</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="shopping-app">
    <header class="app-header">
      <h1>Check Again</h1>

      <p>
        Personalize seus itens e acompanhe o valor total de uma maneira...
        Interessante.
      </p>
    </header>

    <section class="form-section">
      <form id="shopping-form">
        <div class="field-group">
          <label for="product">Produto</label>
    
          <input
            type="text"
            id="product"
            placeholder="Ex.: Arroz"
            required
          >
        </div>
    
        <div class="field-group">
          <label for="quantity">Quantidade</label>
    
          <input
            type="number"
            id="quantity"
            min="1"
            value="1"
            required
          >
        </div>
    
        <div class="field-group">
          <label for="price">Preço unitário</label>
    
          <input
            type="number"
            id="price"
            min="0"
            step="0.01"
            placeholder="0,00"
            required
          >
        </div>
    
        <button type="submit">
          Adicionar item
        </button>
      </form>

      <p id="message" class="message"></p>
      
      <button id="show-list" class="hidden">
        Ver lista
      </button>
      
      <button id="check-again" class="hidden strange-button">
        Verificar novamente
      </button>
      
      <section id="table-section" class="table-section hidden">
        <p id="system-warning" class="system-warning hidden"></p>
      
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Qtd.</th>
              <th>Preço</th>
              <th>Subtotal</th>
              <th>Ações</th>
            </tr>
          </thead>
      
          <tbody id="shopping-list"></tbody>
        </table>
      
        <div class="summary">
          <span>Total</span>
          <strong id="total">R$ 0,00</strong>
        </div>
      </section>
      
      <div id="mystery-timer" class="mystery-timer hidden">
        00:00
      </div>
      
      <footer class="app-footer">
        <p id="clue" class="clue hidden"></p>
      </footer>
      
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
